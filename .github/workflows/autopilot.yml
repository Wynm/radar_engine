name: Autonomous Tech Radar Autopilot

on:
  schedule:
    # التشغيل التلقائي كل 6 ساعات يعمل بالوضع العادي الافتراضي (normal)
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'اختر وضع الرصد (normal = الرائج ذو الصعود | full = شامل بدون فلترة)'
        required: true
        default: 'normal'
        type: choice
        options:
          - normal
          - full

permissions:
  contents: write

jobs:
  run-radar:
    runs-on: ubuntu-latest
    steps:
      - name: سحب ملفات النظام
        uses: actions/checkout@v4

      - name: إعداد بيئة Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: تشغيل محرك الرصد والتحليل والتجربة
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RADAR_MODE: ${{ github.event.inputs.mode || 'normal' }}
        run: python radar_engine.py

      - name: حفظ الذاكرة والتقارير الجديدة تلقائياً
        run: |
          git config --local user.email "autopilot@radar.bot"
          git config --local user.name "TechRadar Bot"
          git add memory.json reports/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update radar reports & memory" && git push)
